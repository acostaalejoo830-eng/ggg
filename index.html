<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrunpxStudios — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d14;--bg2:#13131f;--surface:rgba(255,255,255,0.05);--surface-hover:rgba(255,255,255,0.09);--border:rgba(255,255,255,0.08);--accent:#7c6af7;--accent2:#c084fc;--text:#f0eeff;--text-muted:#9b96b8;--radius:14px;--font:'Inter',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 40px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 40% at 30% 10%,rgba(124,106,247,.18) 0%,transparent 70%),radial-gradient(ellipse 50% 35% at 75% 85%,rgba(192,132,252,.12) 0%,transparent 70%)}
.page-wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:48px 20px 60px}
.profile{text-align:center;margin-bottom:32px}
.avatar-wrap{display:inline-block;margin-bottom:16px}
.avatar,.avatar-placeholder{width:96px;height:96px;border-radius:50%}
.avatar{object-fit:cover;border:2px solid var(--border);background:var(--bg2);display:block}
.avatar-placeholder{background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.15)}
.profile-name{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.profile-bio{font-size:14px;color:var(--text-muted);line-height:1.5;max-width:320px;margin:0 auto}
.links-section{margin-bottom:36px}
.section-label{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;padding-left:2px}
.link-btn{display:flex;align-items:center;gap:14px;width:100%;padding:15px 20px;margin-bottom:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);text-decoration:none;font-size:15px;font-weight:500;transition:background .18s,border-color .18s,transform .12s;backdrop-filter:blur(8px)}
.link-btn:hover{background:var(--surface-hover);border-color:rgba(124,106,247,.35);transform:translateY(-1px)}
.link-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.link-text{flex:1}
.link-arrow{color:var(--text-muted);font-size:16px;flex-shrink:0}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid var(--border);cursor:pointer;transition:transform .15s;position:relative}
.gallery-item:hover{transform:scale(1.03)}
.gallery-item img,.gallery-item video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.vid-badge{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.55);border-radius:4px;padding:2px 5px;font-size:10px;color:#fff}
.video-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:var(--radius);overflow:hidden;background:var(--bg2);border:1px solid var(--border)}
.video-wrap iframe,.video-wrap video{position:absolute;inset:0;width:100%;height:100%;border:none}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.open{opacity:1;pointer-events:all}
.lightbox img{max-width:100%;max-height:88vh;border-radius:10px;object-fit:contain}
.lightbox video{max-width:100%;max-height:88vh;border-radius:10px}
.lightbox-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.footer{text-align:center;color:var(--text-muted);font-size:12px;margin-top:48px;opacity:.6}
</style>
</head>
